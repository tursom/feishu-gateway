services:
  gateway:
    image: ${FEISHU_IMAGE:-ghcr.io/tursom/feishu-gateway:latest}
    restart: unless-stopped
    init: true
    stop_grace_period: 110s
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATABASE_PATH: /data/gateway.sqlite
      FEISHU_CREDENTIALS_FILE: /run/secrets/feishu_credentials
      FEISHU_LOCK_DIR: /locks
    # Loopback only. The trusted proxy/tunnel must be on this host or the private network.
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - type: bind
        source: ${FEISHU_DATA_DIR:-./data}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${FEISHU_LOCKS_DIR:-./locks}
        target: /locks
        bind:
          create_host_path: false
    secrets:
      - feishu_credentials
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - gateway-private
secrets:
  feishu_credentials:
    file: ${FEISHU_SECRET_SOURCE:?Set FEISHU_SECRET_SOURCE to a container-readable credential file}
networks:
  gateway-private:
    ipam:
      config:
        - subnet: 172.30.87.0/24
